<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Reconnecting Astral Conduit | D&D Campaign Notes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f0f13;
      background-image: radial-gradient(circle at 50% 20%, #1a1726 0%, #0f0f13 75%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #181822;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .dice-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(120, 53, 15, 0.3);
      border: 1px solid rgba(217, 119, 6, 0.4);
      border-radius: 20px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .d20-svg {
      width: 42px;
      height: 42px;
      animation: spin 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(0.95); }
    }
    h1 {
      font-family: "Georgia", serif;
      font-size: 22px;
      font-weight: 700;
      color: #fef08a;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(120, 53, 15, 0.4);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      background: #d97706;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      color: #0f172a;
      font-family: "Georgia", serif;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      background: #f59e0b;
      transform: translateY(-1px);
    }
    .countdown {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      font-family: monospace;
    }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dice-container">
      <!-- D20 Die Vector -->
      <svg class="d20-svg" viewBox="0 0 100 100" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="50,5 92,28 92,72 50,95 8,72 8,28" stroke="#f59e0b" fill="rgba(217,119,6,0.15)"/>
        <line x1="50" y1="5" x2="50" y2="95"/>
        <line x1="8" y1="28" x2="92" y2="28"/>
        <line x1="8" y1="72" x2="92" y2="72"/>
        <line x1="50" y1="5" x2="8" y2="72"/>
        <line x1="50" y1="5" x2="92" y2="72"/>
        <line x1="50" y1="95" x2="8" y2="28"/>
        <line x1="50" y1="95" x2="92" y2="28"/>
      </svg>
    </div>

    <div class="badge">
      <span class="status-dot"></span>Updating Codex
    </div>

    <h1>The Astral Conduit is Realigning</h1>
    <p>
      A campaign update is currently deploying or connection was briefly interrupted.<br/>
      Your session is preserved and will reconnect automatically once the server is ready.
    </p>

    <button id="reconnectBtn" class="retry-btn" onclick="retryNow()">
      Reconnect to Codex
    </button>

    <div id="countdown" class="countdown">Next probe in 3 seconds...</div>
  </div>

  <script>
    const TARGET_URL = "https://dnd-campaign-notes-hub.vercel.app";
    const HEALTH_URL = TARGET_URL + "/api/campaigns";
    let secondsLeft = 3;

    function retryNow() {
      document.getElementById("reconnectBtn").innerText = "Connecting...";
      window.location.href = TARGET_URL;
    }

    async function probeServer() {
      try {
        const res = await fetch(HEALTH_URL, { method: "GET", cache: "no-store", mode: "cors" });
        if (res.ok) {
          document.getElementById("countdown").innerText = "Conduit restored! Entering codex...";
          window.location.href = TARGET_URL;
          return;
        }
      } catch (e) {
        // Still deploying or offline
      }
      secondsLeft = 3;
    }

    setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        document.getElementById("countdown").innerText = "Checking conduit...";
        probeServer();
      } else {
        document.getElementById("countdown").innerText = "Next probe in " + secondsLeft + "s...";
      }
    }, 1000);
  </script>
</body>
</html>
